name: Nexus Raspberry Pi 5 image
on:
  workflow_dispatch:
  push:
    branches: [dev, codex/alpha5-experience]
    paths: ["product/**", ".github/workflows/nexus-image.yml"]
permissions:
  contents: read
concurrency:
  group: nexus-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node product/tools/check.mjs
      - run: node --test product/test/*.test.mjs
      - run: python3 -m unittest discover -s product/test -p '*_test.py'
      - run: python3 -m py_compile product/image/runtime/*.py
      - run: find product/image -name '*.sh' -exec bash -n {} \;
      - name: Use the primary Ubuntu mirror for test dependencies
        run: |
          # Azure mirror downloads timed out repeatedly on the hosted runner.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-nexus-ci
      - name: Install isolated browser test dependency
        timeout-minutes: 8
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/nexus-qa" playwright@1.62.1
          "$RUNNER_TEMP/nexus-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify integrated tablet keyboard
        run: NEXUS_PLAYWRIGHT="$RUNNER_TEMP/nexus-qa/node_modules/playwright/index.mjs" node product/tools/smoke-keyboard.mjs
      - name: Upload tablet keyboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-keyboard-evidence
          path: product/qa/keyboard/*
      - name: Verify device controls and pairing UI
        run: NEXUS_PLAYWRIGHT="$RUNNER_TEMP/nexus-qa/node_modules/playwright/index.mjs" node product/tools/smoke-devices.mjs
      - name: Upload device experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-device-evidence
          path: product/qa/devices/*
      - name: Render device review frames
        if: always()
        run: |
          python3 - <<'PY'
          import base64, pathlib
          for path in pathlib.Path("product/qa/devices").glob("*.png"):
              encoded=base64.b64encode(path.read_bytes()).decode()
              for index in range(0,len(encoded),8192):
                  print("DEVICE_FRAME:"+path.stem+":"+str(index)+":"+encoded[index:index+8192])
          PY
      - name: Verify interactive UI
        run: |
          node product/tools/serve.mjs &
          NEXUS_PLAYWRIGHT="$RUNNER_TEMP/nexus-qa/node_modules/playwright/index.mjs" node product/tools/smoke-ui.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ui-evidence
          path: product/qa/*
      - name: Verify real backend before building image
        run: |
          mkdir -p "$RUNNER_TEMP/nexus-config/www/nexus"
          cp product/image/runtime/configuration.yaml "$RUNNER_TEMP/nexus-config/"
          cp product/web/* "$RUNNER_TEMP/nexus-config/www/nexus/"
          docker run -d --name nexus-backend-check -p 127.0.0.1:18123:8123 -v "$RUNNER_TEMP/nexus-config:/config" ghcr.io/home-assistant/home-assistant:2026.10.4
          trap 'docker logs --tail 150 nexus-backend-check; docker rm -f nexus-backend-check' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18123/api/onboarding >/dev/null; then break; fi
            sleep 2
          done
          node product/tools/smoke-backend.mjs
      - name: Verify complete Nexus setup against a fresh core
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-websocket
          mkdir -p "$RUNNER_TEMP/nexus-onboarding-config"
          cp product/image/runtime/configuration.yaml "$RUNNER_TEMP/nexus-onboarding-config/"
          docker run -d --name nexus-onboarding-check -p 127.0.0.1:18123:8123 -v "$RUNNER_TEMP/nexus-onboarding-config:/config" ghcr.io/home-assistant/home-assistant:2026.10.4
          export NEXUS_CORE_URL=http://127.0.0.1:18123
          export NEXUS_STATE_DIR="$RUNNER_TEMP/nexus-onboarding-state"
          python3 product/test/serve_portal_fixture.py &
          PORTAL_PID=$!
          trap 'kill "$PORTAL_PID" || true; docker logs --tail 80 nexus-onboarding-check; docker rm -f nexus-onboarding-check' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18123/api/onboarding >/dev/null; then break; fi
            sleep 2
          done
          NEXUS_PLAYWRIGHT="$RUNNER_TEMP/nexus-qa/node_modules/playwright/index.mjs" node product/tools/smoke-onboarding.mjs
          kill "$PORTAL_PID"
          wait "$PORTAL_PID" || true
          docker restart nexus-onboarding-check
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18123/ >/dev/null; then break; fi
            sleep 2
          done
          python3 product/test/serve_portal_fixture.py &
          PORTAL_PID=$!
          NEXUS_PLAYWRIGHT="$RUNNER_TEMP/nexus-qa/node_modules/playwright/index.mjs" node product/tools/smoke-onboarding.mjs --resume
      - name: Upload Nexus onboarding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-onboarding-evidence
          path: product/qa/onboarding/*
      - name: Render review frames
        if: success()
        run: |
          python3 - <<'PY'
          import base64, pathlib
          for name in ["02-region", "07-dashboard"]:
              print("NEXUS_FRAME_" + name + ":" + base64.b64encode(pathlib.Path("product/qa/onboarding/" + name + ".png").read_bytes()).decode())
          PY
  graphical:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test real kiosk startup in virtual X11
        run: |
          docker build -f product/image/graphical-test.Dockerfile -t nexus-graphical-test .
          # Disposable CI container allows Chromium sandbox namespaces.
          # Production Chromium retains its sandbox and has no added capabilities.
          mkdir -p product/qa/graphical
          chmod 777 product/qa/graphical
          docker run -v "$PWD/product/qa/graphical:/evidence" --rm --cap-add SYS_ADMIN --security-opt seccomp=unconfined --shm-size=512m nexus-graphical-test
      - name: Upload graphical session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-graphical-evidence
          path: product/qa/graphical/*
  image:
    if: github.ref == 'refs/heads/dev'
    needs: [validate, graphical]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build ARM64 image with pinned pi-gen
        run: bash product/image/build.sh
      - name: Install virtual display verification tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-xserver-utils imagemagick
      - name: Verify image contents and real Home Assistant integration
        run: bash product/image/verify.sh
      - name: Upload installed image graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-installed-graphical-evidence
          path: product/qa/installed/*
      - name: Upload flashable image and checksums
        uses: actions/upload-artifact@v4
        with:
          name: nexus-rpi5-arm64-alpha5
          path: product/dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

