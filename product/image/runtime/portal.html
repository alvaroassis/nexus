<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nexus · Welcome</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f3ef;
        color: #202822;
        font: 18px system-ui;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 32px;
      }
      h1 {
        font-size: 64px;
        letter-spacing: -4px;
        margin: 16px 0;
      }
      h2 {
        font-size: 32px;
        font-weight: 550;
      }
      p {
        line-height: 1.6;
        color: #59675e;
      }
      button,
      input,
      select,
      a {
        font: inherit;
        min-height: 52px;
        border-radius: 14px;
        padding: 14px;
        border: 1px solid #c8d2c9;
      }
      button,
      a {
        cursor: pointer;
        background: #256442;
        color: #fff;
        text-decoration: none;
        display: inline-block;
      }
      button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      input,
      select {
        background: #fff;
        width: 100%;
        color: #202822;
      }
      label {
        display: grid;
        gap: 8px;
        margin: 16px 0;
      }
      .card {
        background: #fff;
        padding: 28px;
        border-radius: 28px;
        margin: 24px 0;
      }
      .status {
        padding: 14px;
        background: #e4eddf;
        border-radius: 14px;
        white-space: pre-line;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #256442;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .keyboard {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .keyboard button {
        min-width: 38px;
        flex: 1;
        background: #e4eddf;
        color: #202822;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>nexus.</h1>
      <label
        ><span id="language-label">Language</span
        ><select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select></label
      >
      <h2 id="title"></h2>
      <p id="intro"></p>
      <section class="card">
        <h3 id="network-title"></h3>
        <div id="network-status" class="status" role="status"></div>
        <button id="refresh" type="button"></button>
        <form id="wifi" hidden>
          <label
            ><span id="adapter-label"></span
            ><select id="adapter" name="interface"></select></label
          ><button id="scan" type="button"></button
          ><label
            ><span id="ssid-label"></span
            ><input
              id="ssid"
              name="ssid"
              list="networks"
              autocomplete="off"
              required
              maxlength="32" /></label
          ><datalist id="networks"></datalist
          ><label
            ><span id="auth-label"></span
            ><select id="auth" name="auth">
              <option value="wpa-psk">WPA/WPA2</option>
              <option value="open" id="open-label"></option></select></label
          ><label
            ><span id="password-label"></span
            ><input
              id="password"
              name="password"
              type="password"
              autocomplete="off"
              maxlength="64" /></label
          ><button id="join"></button>
        </form>
        <p id="message" role="status"></p>
        <p id="keyboard-hint"></p>
      </section>
      <p id="ready" role="status"></p>
      <a id="continue" hidden></a>
      <p id="account-info"></p>
    </main>
    <script type="module" src="/portal.mjs"></script>
  </body>
</html>
